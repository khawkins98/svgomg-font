<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220">
  <style><![CDATA[
    .h { font-family: 'Inter'; font-weight: 700; font-size: 34px; fill: #0b0b0c; letter-spacing: -0.02em; }
    .sub { font-family: 'Inter'; font-weight: 400; font-size: 14px; fill: #555; }
    .badge { font-family: 'Inter'; font-weight: 600; font-size: 11px; fill: #fff; letter-spacing: 0.08em; text-anchor: middle; }
  ]]></style>
  <rect width="480" height="220" fill="#fff"/>
  <!-- Wider badge (66 vs 58) + text-anchor:middle so "NEW" is centered with balanced padding. -->
  <rect x="30" y="28" width="66" height="22" rx="4" fill="#ed8b00"/>
  <text x="63" y="44" class="badge">NEW</text>
  <!-- Baselines: 96 / 140 (44px leading for a 34px face ≈ 1.29 line height).
       Old file had 92 / 124 = 32px leading on a 36px face, so the "g" descender
       overlapped the "f" ascender of the next line. -->
  <text x="30" y="96" class="h">Designed for clarity.</text>
  <text x="30" y="140" class="h" fill="#1fb7b3">Built for the web.</text>
  <text x="30" y="184" class="sub">Static SVGs that look right anywhere — no font install required.</text>
</svg>
